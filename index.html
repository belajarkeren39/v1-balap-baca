<!DOCTYPE html>
<html lang="id">

<title>Balap Baca — Mini 4WD Night Circuit</title>
<style>
:root{--gold:#e0b84a;--gold2:#8a6a14;--red:#d6202f;--ink:#f4efe3;--card:#12141a;--bg:#06070a;--disp:Impact,Haettenschweiler,"Arial Narrow Bold","Arial Black",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI","Trebuchet MS",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;box-shadow:0 0 0 6px #000}
#g{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;background:linear-gradient(#0c0d11,#181b22);border-bottom:3px solid var(--gold);box-shadow:0 8px 22px rgba(0,0,0,.65);color:#fff;padding:8px 10px 10px;z-index:3}
#hud[hidden],#ctl[hidden],.scr[hidden]{display:none}
#row1{display:flex;align-items:center;gap:10px}
#track{position:relative;flex:1;height:30px;border-radius:15px;border:2px solid #3a3d47;background:linear-gradient(90deg,rgba(224,184,74,.55) 50%,transparent 0) 0 50%/20px 2px repeat-x,linear-gradient(#2b2e36,#16181d)}
#track::after{content:"";position:absolute;right:-2px;top:-2px;bottom:-2px;width:20px;border-radius:0 15px 15px 0;background:conic-gradient(#f4efe3 25%,#07080b 0 50%,#f4efe3 0 75%,#07080b 0) 0 0/10px 10px}
#track b{display:none}
.dot{position:absolute;top:1px;width:24px;height:24px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.6)}
.dot.me{top:-2px;width:30px;height:30px;font-size:15px;z-index:2;box-shadow:0 0 0 3px var(--gold),0 0 12px var(--gold)}
.sbtn{min-width:48px;min-height:48px;border:2px solid var(--gold);border-radius:12px;background:linear-gradient(#34373f,#14161c);color:#fff;font-size:22px;box-shadow:0 3px 0 #000}
#q{order:-1;position:relative;margin:0 0 8px;background:linear-gradient(#fffdf5,#eadfbd);color:#14161a;border:3px solid var(--gold);border-radius:16px;box-shadow:0 0 0 2px #000,inset 0 -4px 0 rgba(138,106,20,.25);padding:6px 10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#q .sbtn{position:absolute;right:6px;top:6px}
#qe{font-size:clamp(44px,12vw,72px);line-height:1.1}
#qt{flex:0 1 auto;font-size:clamp(24px,6.4vw,44px);line-height:1.2;font-weight:900}
#hud.dl #q{flex-direction:row;gap:10px;padding:4px 56px 4px 12px}
#hud.dl #qe{font-size:clamp(30px,8vw,44px)}
#hud.dl #qt{flex:1;font-size:clamp(18px,4.6vw,30px)}
@media (max-height:520px){#q{flex-direction:row;gap:10px;padding:4px 56px 4px 12px}#qe{font-size:clamp(30px,8vh,44px)}#qt{flex:1;font-size:clamp(18px,5vh,30px)}}
#ctl{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:space-between;padding:0 14px;z-index:3;pointer-events:none}
#ctl button{pointer-events:auto;width:30%;min-height:64px;border:2px solid var(--gold);border-radius:16px;background:linear-gradient(#3a3e4a,#14161c);color:var(--gold);font-size:30px;font-weight:900;box-shadow:0 5px 0 #000,0 0 18px rgba(224,184,74,.25)}
#ctl button:active{transform:translateY(3px);box-shadow:0 2px 0 #000}
.scr{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto;background:radial-gradient(ellipse at 50% 35%,rgba(6,7,10,.45),rgba(6,7,10,.9))}
.card{position:relative;background:linear-gradient(160deg,#1b1e27,#0c0d11);color:var(--ink);border-radius:18px;padding:20px;width:min(100%,460px);text-align:center;border:2px solid var(--gold);box-shadow:0 0 0 1px #000,0 0 0 6px rgba(224,184,74,.16),0 24px 60px rgba(0,0,0,.75);margin:auto;overflow:hidden;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.card::before{content:"";display:block;height:16px;margin:-20px -20px 16px;background:conic-gradient(#f4efe3 25%,#07080b 0 50%,#f4efe3 0 75%,#07080b 0) 0 0/16px 16px;border-bottom:2px solid var(--gold)}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
h1{margin:0;font-family:var(--disp);font-weight:400;font-style:italic;text-transform:uppercase;letter-spacing:.03em;font-size:clamp(44px,13vw,64px);line-height:1;background:linear-gradient(#fff7da,#e0b84a 52%,#8a6a14);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #000) drop-shadow(0 0 14px rgba(224,184,74,.35))}
.tag{margin:6px 0 12px;color:var(--gold);font-weight:700;font-size:14px;letter-spacing:.14em}
h2{margin:0 0 6px;font-family:var(--disp);font-weight:400;font-style:italic;font-size:38px;color:var(--gold);text-shadow:0 3px 0 #000,0 0 18px rgba(224,184,74,.4)}
#rs{color:var(--gold);text-shadow:0 0 18px rgba(224,184,74,.6)}
.card p{margin:6px 0 14px;font-size:17px;line-height:1.35}
.lv{display:block;width:100%;margin:10px 0;min-height:72px;padding:8px 14px;border:0;border-left:8px solid var(--gold);border-radius:12px;background:linear-gradient(100deg,var(--c),#0c0d11 135%);color:#fff;text-align:left;font-family:var(--disp);font-weight:400;font-style:italic;font-size:26px;letter-spacing:.02em;box-shadow:0 5px 0 #000,inset 0 1px 0 rgba(255,255,255,.25)}
.lv small{display:block;font-family:"Segoe UI","Trebuchet MS",system-ui,sans-serif;font-style:normal;letter-spacing:0;font-size:15px;font-weight:600;opacity:.92}
.lv i{float:right;font-style:normal;font-size:20px;margin-top:6px;color:var(--gold)}
.lv:active,.go:active{transform:translateY(4px)}
.go{min-height:60px;border:0;border-radius:12px;padding:8px 24px;background:linear-gradient(#f6dc86,#e0b84a 55%,#b88d22);color:#14161a;font-family:var(--disp);font-style:italic;font-weight:400;font-size:24px;letter-spacing:.03em;box-shadow:0 6px 0 var(--gold2),0 0 18px rgba(224,184,74,.3);margin:6px 4px}
.go.alt{background:linear-gradient(#34373f,#14161c);color:var(--gold);border:2px solid var(--gold);box-shadow:0 6px 0 #000}
.hint{font-size:15px;opacity:.8}
.chips{display:flex;gap:8px;margin:10px 0}.chips[hidden]{display:none}
.chip{flex:1;min-height:60px;border:2px solid #3a3d47;border-radius:12px;background:linear-gradient(#232630,#14161c);color:var(--ink);font-weight:800;font-size:15px;line-height:1.15;padding:4px}
.chip[aria-checked="true"]{background:linear-gradient(#f6dc86,#e0b84a);border-color:#fff3c4;color:#14161a;box-shadow:0 0 16px rgba(224,184,74,.45)}
#pads{position:absolute;left:0;right:0;bottom:10px;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 10px}
#pads[hidden]{display:none}
.pad{background:rgba(255,255,255,.96);color:#143a5c;border:4px solid;border-radius:18px;padding:4px 6px 6px;font-weight:900;font-size:14px}
.pad .bs{display:flex;gap:6px;margin-top:3px}
.pad button{flex:1;min-height:48px;border:0;border-radius:12px;font-weight:900;font-size:22px}
.pad button.on{box-shadow:inset 0 0 0 4px #fff,0 0 0 4px #143a5c;transform:scale(1.05)}
#pads{top:0;bottom:0;display:block;padding:0;pointer-events:none}
.pad{position:absolute;display:flex;justify-content:space-between;align-items:flex-end;padding:0 6px;background:none;border:0;border-radius:0;pointer-events:none}
.pad button{flex:none;width:42%;min-height:46px;color:#fff;border:2px solid rgba(255,255,255,.7);box-shadow:0 4px 0 rgba(0,0,0,.5);pointer-events:auto}
.pad button:active{transform:translateY(3px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* MINI 4WD NIGHT CIRCUIT — self-contained, no external assets */
:root{--gold:#65edff;--gold2:#137991;--ink:#edf8ff;--bg:#060d1c}

.card{border:1px solid #34516c;border-radius:24px;background:linear-gradient(145deg,rgba(21,40,64,.98),rgba(6,17,34,.98));box-shadow:0 28px 90px #0009,0 0 60px #23caff0c;padding:28px}

.eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;color:#8da9c4;display:flex;align-items:center;gap:8px;margin-bottom:16px}
.eyebrow::before{content:'';width:7px;height:7px;background:#65edff;border-radius:50%;box-shadow:0 0 12px #65edff}
h1{font-size:clamp(50px,6vw,72px);line-height:.95;background:linear-gradient(#fff 25%,#9beaff);filter:drop-shadow(3px 4px 0 #193e61);letter-spacing:.01em}
.tag{font-size:12px;color:#65edff;letter-spacing:.22em;text-transform:uppercase;margin:12px 0 20px}
.card p{font-size:15px;line-height:1.6;color:#b7cbe0;margin-bottom:18px}
.garage{position:relative;height:235px;margin:12px 0 16px;isolation:isolate;border:1px solid #25425c;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#163f5b,transparent 67%),repeating-linear-gradient(0deg,transparent 0 27px,#76d7ff0c 28px 29px),repeating-linear-gradient(90deg,transparent 0 27px,#76d7ff0c 28px 29px),#09182b}

.garage::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,#bdf8ff14 45%,transparent 60%);transform:translateX(-100%);animation:scan 5s ease-in-out infinite;pointer-events:none}
.hero-car{position:absolute;inset:6px 0 0;width:100%;height:220px;filter:drop-shadow(0 18px 10px #0009);animation:hovercar 3.5s ease-in-out infinite}
.garage-label{position:absolute;left:14px;bottom:13px;font-size:10px;letter-spacing:.15em;color:#89abc6;font-weight:800}
.garage-label b{color:#eafaff;display:block;font-size:14px;letter-spacing:.05em;margin-bottom:3px}
.spec{position:absolute;right:12px;top:12px;font-size:10px;font-weight:900;letter-spacing:.08em;padding:6px 8px;border-radius:5px;color:#65edff;border:1px solid #65edff55;background:#061326aa}
.steps{display:flex;gap:8px;flex-wrap:wrap;color:#a2bcd2;font-size:12px}.steps span{display:flex;align-items:center;gap:6px}.steps b{display:grid;place-items:center;border:1px solid #426079;border-radius:50%;width:19px;height:19px;font-size:10px;color:#65edff}
.setup{padding-top:3px}.setup-label{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:800;color:#91abc3;margin-bottom:8px}.setup-label.classes{margin-top:20px}
.chips{gap:7px;margin:0 0 10px}.chip{border:1px solid #34516c;background:#11243b;font-size:13px;color:#b7cbe0;min-height:66px;border-radius:10px;transition:background .2s,transform .2s}
.chip:hover{background:#1c3853;transform:translateY(-2px)}
.chip[aria-checked="true"]{background:#163e53;border-color:#65edff;color:#f0fdff;box-shadow:inset 0 -3px #65edff,0 0 18px #65edff12}
.lv{position:relative;font-family:inherit;font-style:normal;font-size:21px;font-weight:850;background:linear-gradient(105deg,color-mix(in srgb,var(--c),#112338 78%),#101e31);border:1px solid #36516c;border-left:4px solid var(--c);border-radius:12px;min-height:73px;margin:10px 0;padding:10px 13px;box-shadow:none;transition:transform .18s,border-color .18s}
.lv:hover{transform:translateX(4px);border-color:#65edff}.lv small{font-size:12px;font-weight:500;color:#a9c0d7;margin-top:4px}.lv i{font-size:14px}.lv::after{content:'→';position:absolute;right:14px;top:26px;color:#80d9ef}.lv i:not(:empty){margin-right:17px;font-size:11px}
#mh{font-size:12px;line-height:1.5;margin:14px 0 0;color:#a7bdd0;opacity:1}
.sbtn{border:1px solid #3f657e;background:linear-gradient(#1b3750,#0d2034);border-radius:10px;box-shadow:0 3px 0 #030b16;color:#c9f5ff}
#fs2{border:1px solid #3f657e!important;z-index:2;min-width:40px;min-height:40px}
#hud{background:linear-gradient(#08172cf5,#0d2338f5);border-bottom:2px solid #4edcf7;box-shadow:0 8px 25px #02091199;padding:8px 12px 10px}
#q{background:linear-gradient(115deg,#f6fcff,#dceffc);border:2px solid #77dbef;border-radius:14px;box-shadow:inset 0 -4px #c4dfef;color:#11283b}
#track{border-color:#385770;background:repeating-linear-gradient(90deg,transparent 0 12px,#a7d3e755 12px 21px,transparent 21px 30px) center/100% 2px no-repeat,#071526}
.dot.me{box-shadow:0 0 0 2px #65edff,0 0 15px #65edff70}
#ctl{bottom:16px;padding:0 20px}#ctl button{max-width:200px;min-height:60px;border:1px solid #60d8f5;background:linear-gradient(135deg,#173c59ec,#0b1b30ed);box-shadow:0 5px 0 #020a17,0 0 24px #24c5e520;border-radius:14px;color:#b8f7ff}
.go{background:linear-gradient(#adf8ff,#61deed);box-shadow:0 5px 0 #227a96;font-family:inherit;font-weight:850;font-size:19px;font-style:normal}.go.alt{border:1px solid #3f657e;background:#142c43}
h2{color:#a7f6ff;font-size:36px;text-shadow:none}#rs{text-shadow:0 0 20px #65edff50}
#res .card{width:min(100%,490px)}
#ctl{justify-content:center;gap:12px}
#ctl button{width:clamp(72px,22vw,116px);max-width:116px}
.pad{justify-content:center;gap:8px}
.pad button{width:38%;max-width:100px}
@keyframes hovercar{0%,100%{transform:translateY(0) rotate(-24deg)}50%{transform:translateY(-8px) rotate(-22deg)}}
@keyframes scan{0%,20%{transform:translateX(-100%)}70%,100%{transform:translateX(100%)}}
@media(max-width:720px){.scr{padding:16px 12px}#menu .card{width:min(100%,470px);display:block;padding:22px}#menu .card::before{margin:-22px -22px 20px}.eyebrow{margin-bottom:12px;font-size:10px}h1{font-size:56px}.tag{margin:10px 0 12px}.garage{height:155px;margin:8px 0 14px}.hero-car{height:160px;inset:-9px 0 0}.garage::before{top:7px;left:calc(50% - 155px);height:120px}.garage-label b{font-size:12px}.garage-label{font-size:8px;bottom:10px}.spec{font-size:9px}.steps{margin-bottom:22px;font-size:11px}.card p{font-size:14px;margin-bottom:12px}.setup-label.classes{margin-top:16px}.lv{min-height:68px}.chip{min-height:59px}#mh{font-size:11px}}

</style>

<body>
<div id="g">
  <canvas id="cv" aria-label="Arena balapan: tiga jalur dengan papan jawaban"></canvas>
  <header id="hud" hidden>
    <div id="row1"><button class="sbtn" id="home" type="button" aria-label="Kembali ke menu">🏠</button><div id="track"><b>🏁</b></div><button class="sbtn" id="snd" type="button" aria-label="Suara hidup atau mati">🔊</button><button class="sbtn fsx" id="fs" type="button" aria-label="Layar penuh">⛶</button></div>
    <div id="q"><span id="qe"></span><b id="qt"></b><button class="sbtn" id="sp" type="button" aria-label="Dengarkan soal">📢</button></div>

  <div id="pads" hidden></div>

  <section id="menu" class="scr"><button class="sbtn fsx" id="fs2" type="button" aria-label="Layar penuh" style="position:absolute;top:10px;right:10px;border:2px solid #e0b84a">⛶</button><div class="card">
<div class="intro">
<div class="eyebrow">BELAJAR SERU • MINI 4WD</div>
<h1>BALAP<br>BACA</h1><div class="tag">Night circuit / Reading cup</div>
<p>Baca soalnya. Pilih jalurnya.<br>Pacukan mobilmu menuju podium!</p>

<span class="spec">4WD / TURBO</span>
<svg class="hero-car" viewBox="0 0 360 240" aria-hidden="true">

<g transform="translate(180 117)">
<ellipse cy="14" rx="60" ry="91" fill="#020a18" opacity=".5"/>
<g fill="#080f1d" stroke="#4d6984" stroke-width="2"><rect x="-48" y="-65" width="21" height="40" rx="7"/><rect x="27" y="-65" width="21" height="40" rx="7"/><rect x="-48" y="32" width="21" height="40" rx="7"/><rect x="27" y="32" width="21" height="40" rx="7"/></g>
<path d="M-52-78H52M-55 80H55" stroke="#799ab3" stroke-width="7"/>

<path d="M-8-87H0L-12-26-30 4-23 61H-31L-37-16-21-47Z" fill="#f2fcff"/>
<path d="M10-86H17L25-49 37-17 32 58H22L30 1 15-29Z" fill="#ff4760"/>
<path d="M-18-30H18L23 7H-23Z" fill="url(#glass)" stroke="#b4f6ff" stroke-width="1.5"/>
<path d="M-15-26H-7L-13 2H-20Z" fill="#b6faff" opacity=".5"/>

<circle cy="51" r="12" fill="#edfaff"/><text y="55" text-anchor="middle" font-size="12" font-weight="900" fill="#164eaa" font-family="Arial">01</text>
<path d="M-44 65H44V79H-44Z" fill="#effaff" stroke="#74d7ef" stroke-width="2"/><path d="M-9 65H9V79H-9Z" fill="#ff4760"/>
<path d="M-26-69H-13M13-69H26" stroke="#d5fdff" stroke-width="5"/>
</g></svg>
<div class="garage-label"><b>BLUE COMET / 01</b>SIAP MELAJU. SIAP JADI JUARA.</div>
</div><div class="steps"><span><b>1</b>Baca soal</span><span><b>2</b>Pilih jalur</span><span><b>3</b>Raih podium</span></div></div>

    <div class="chips" id="modes" role="radiogroup" aria-label="Mode permainan"><button class="chip" type="button" role="radio" data-m="solo">🏎️<br>Sendiri</button><button class="chip" type="button" role="radio" data-m="cpu">🤖<br>Lawan komputer</button><button class="chip" type="button" role="radio" data-m="duel">👫<br>Duel 2–4 pemain</button></div>

  </div></section>

  <section id="res" class="scr" hidden><div class="card">
    <h2 id="rt"></h2><div id="rs" style="font-size:44px;letter-spacing:6px"></div>

    <button class="go" id="again" type="button">Balapan lagi</button><button class="go alt" id="tomenu" type="button">Pilih kelas</button>
  </div></section>
</div>
<script>
